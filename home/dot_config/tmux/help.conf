# ######################################################################
# 快捷键帮助配置
# ######################################################################

# ============================================================
# 自定义帮助弹窗
# ============================================================
# 前缀提示配置
set -g @prefix_hint_delay_ms 1200
set -g @prefix_hint_duration_ms 2500
set -g @prefix_hint_message "提示: 按 ? 查看快捷键帮助"

# 使用独立的帮助清单文件，按个人习惯顺序展示常用快捷键
bind-key -N "显示快捷键帮助面板" ? display-popup -w 70% -h 80% -T "Tmux 快捷键帮助" -E "sh -c 'less -R ~/.config/tmux/keybindings-help.txt'"
