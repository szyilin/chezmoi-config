# ######################################################################
# 插件配置
# ######################################################################

# ============================================================
# TPM (Tmux Plugin Manager) 配置
# ============================================================
# 设置插件管理器路径
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.local/share/tmux/plugins'

# 自动安装 TPM（如果不存在）
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

# 配置里新增了插件但尚未 clone 时，自动执行 TPM 安装（无需手动 prefix+I）
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tmux-resurrect" || test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tmux-continuum"' {
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

# ============================================================
# 插件列表
# ============================================================
# TPM 插件管理器（必须）
set -g @plugin 'tmux-plugins/tpm'

# 基础插件 - 提供合理的默认配置
set -g @plugin 'tmux-plugins/tmux-sensible'

# 基础插件 - 复制到系统剪贴板
set -g @plugin 'tmux-plugins/tmux-yank'

# ============================================================
# 会话骨架持久化（tmux-resurrect + tmux-continuum）
# ============================================================
# 目标：Mac 重启后恢复 session/window/pane 的数量、名称、顺序、布局与目录；
# 不恢复 pane 内程序、滚动缓冲或 shell 历史（重启即“清空”工作内容）。
#
# 依赖：continuum 必须排在 TPM 插件列表最后（避免 status-right 被主题覆盖导致无法自动保存）。
set -g @plugin 'tmux-plugins/tmux-resurrect'

# 不恢复 pane 内正在运行的程序，只在新 shell 中恢复工作目录与布局
set -g @resurrect-processes 'false'
# 不开启 @resurrect-capture-pane-contents（默认即关闭，勿保存 pane 滚动内容）

# 与 ~/.local/share/tmux/plugins 保持一致的 XDG 风格路径
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# 每 15 分钟自动保存；tmux 服务首次启动时自动 restore
set -g @continuum-restore 'on'

# 手动：prefix + Ctrl-s 保存，prefix + Ctrl-r 恢复
# 临时禁用自动恢复：touch ~/tmux_no_auto_restore

# ============================================================
# 主题和样式插件
# ============================================================
# Catppuccin 主题（Mocha 风格）
set -g @plugin 'catppuccin/tmux'

# ============================================================
# Catppuccin 主题配置
# ============================================================
# 主题风格：mocha（可选：latte, frappe, macchiato, mocha）
set -g @catppuccin_flavor 'mocha'
# 窗口状态样式：rounded（圆角）
set -g @catppuccin_window_status_style 'rounded'
# 窗口编号位置：right（右侧）
set -g @catppuccin_window_number_position 'right'
# 窗口状态显示：no（不显示）
set -g @catppuccin_window_status 'no'
# 非当前窗口文本格式
# 如果有窗口名称就显示名称，否则显示 "窗口#索引"
# 如果窗口被缩放（折叠），显示 [Z] 标识
set -g @catppuccin_window_text '#{?#{window_zoomed_flag}, ,}#{?#{==:#W,},窗口 #I,#W}'
# 当前窗口填充方式：number（显示编号）
set -g @catppuccin_window_current_fill 'number'
# 当前窗口文本格式
# 如果有窗口名称就显示名称，否则显示 "窗口#索引"
# 如果窗口被缩放（折叠），显示 [Z] 标识
set -g @catppuccin_window_current_text '#{?#{window_zoomed_flag}, ,}#{?#{==:#W,},窗口 #I,#W}'
# 当前窗口颜色
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
# 日期时间格式：月/日 周 时:分
set -g @catppuccin_date_time_text '%m/%d %a %H:%M'
# 状态模块文本背景色
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'
# 加载 Catppuccin 主题
# 注意：这会在插件加载时执行，用于初始化主题
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# 自动保存钩子（必须位于插件列表最末）
set -g @plugin 'tmux-plugins/tmux-continuum'
