# ######################################################################
# 通用配置
# ######################################################################

# ============================================================
# 窗口和面板索引配置
# ============================================================
# 窗口编号从 1 开始（而不是默认的 0）
set -g base-index 1
# 面板编号从 1 开始（而不是默认的 0）
set -g pane-base-index 1
# 关闭窗口后自动重新编号（保持编号连续）
set -g renumber-window on

# ============================================================
# 终端颜色配置
# ============================================================
# 设置默认终端类型为 256 色
set -g default-terminal 'screen-256color'
# 为 xterm-256color 终端启用 RGB 颜色支持
# 这允许使用真彩色，提供更好的颜色显示效果
set -ag terminal-overrides ',xterm-256color*:RGB'

# ============================================================
# 窗口重命名配置
# ============================================================
# 禁止自动重命名窗口（保持窗口名称稳定）
set -g allow-rename off

# ============================================================
# Copy Mode 配置
# ============================================================
# 启用 vi 模式的 copy mode（支持 v、V、Ctrl-v 等操作，类似 neovim）
# 这样可以在 copy mode 中使用 vi 风格的快捷键来选择文本
set -g mode-keys vi

