# ######################################################################
# Tmux 主配置文件
# ######################################################################
# 按顺序加载各个配置文件
# 注意：加载顺序很重要，某些配置可能依赖前面的配置

# 1. 插件配置（必须最先加载，设置插件路径和加载主题）
source-file ~/.config/tmux/plugins.conf

# 2. 通用配置（基础设置，如索引、终端类型等）
source-file ~/.config/tmux/general.conf

# 3. 快捷键配置（按键绑定）
source-file ~/.config/tmux/keybindings.conf

# 4. 帮助配置（快捷键提示和帮助面板）
source-file ~/.config/tmux/help.conf

# 5. 状态栏配置（状态栏显示和自定义模块）
source-file ~/.config/tmux/status.conf

# ============================================================
# 初始化 Tmux 插件管理器
# ============================================================
# 重要：这行必须保持在配置文件的最底部
# TPM 会加载所有已配置的插件
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
