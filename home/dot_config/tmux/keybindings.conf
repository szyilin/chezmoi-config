# ######################################################################
# 快捷键配置
# ######################################################################

# ============================================================
# 前缀键配置
# ============================================================
# 移除默认的 C-b 前缀
unbind C-b
# 设置 Opt/Alt-b 为主前缀键
set-option -g prefix M-b
bind-key M-b send-prefix
# 创建新的 session/window
bind-key C command-prompt -p "Session name: " \
"if-shell -b '[ -n \"%1\" ]' \
    'new-session -s \"%1\"' \
    'new-session'"
bind-key c command-prompt -p "Window name: " \
"if-shell -b '[ -n \"%1\" ]' \
    'new-window -n \"%1\"' \
    'new-window'"
# 关闭 session/window
bind-key q confirm-before -p "Kill window #W? (y/n)" kill-window
bind-key Q confirm-before -p "Kill session #S? (y/n)" kill-session
# 上一个/下一个 切换 session/window 
bind-key n next-window
bind-key p previous-window
bind-key N switch-client -n
bind-key P switch-client -p
# 重命名 session/window
bind-key r command-prompt "rename-window '%%'"
bind-key R command-prompt "rename-session '%%'"
# pane 移动（hjkl）
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# 分割窗口
unbind '"'
unbind %
bind-key v split-window -h
bind-key s split-window -v

# ============================================================
# Copy Mode 快捷键配置（vi 模式）
# ============================================================
# v - 进入字符选择模式（类似 neovim 的 v）
# 使用方式：进入 copy mode 后按 v，然后用 hjkl 或 w/e/b 移动光标选择文本
bind-key -T copy-mode-vi v send-keys -X begin-selection

# V - 进入行选择模式（类似 neovim 的 V）
# 使用方式：进入 copy mode 后按 V 选择整行
bind-key -T copy-mode-vi V send-keys -X select-line

# Ctrl-v - 进入块选择模式（类似 neovim 的 Ctrl-v）
# 使用方式：进入 copy mode 后按 Ctrl-v 进入矩形选择模式
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
